# http{} context (rulebook N1: zones never inside server{}). Included by the official image's
# nginx.conf via /etc/nginx/conf.d/*.conf.

server_tokens off;

# Login rate limit (Story 1.2 review ISS-005): POST to the sign-in page, 5 per minute per client
# address. Non-POST requests get an empty key, which limit_req ignores.
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:10m rate=5r/m;

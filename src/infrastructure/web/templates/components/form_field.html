{% load ui %}{% if group %}<fieldset class="field field--group{% if field.errors %} field--invalid{% endif %}"{% for name, value in group_aria.items %} {{ name }}="{{ value }}"{% endfor %}>
  <legend class="field__label">{% include "components/_field_label_text.html" %}</legend>
{% else %}<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="field__label" for="{{ id }}">{% include "components/_field_label_text.html" %}</label>
{% endif %}  {{ widget }}
  {% if help %}<p class="field__help" id="{{ id }}_help">{{ help }}</p>{% endif %}
  {% if field.errors %}<p class="field__error field-error" id="{{ id }}_error">
    {% ui_icon "warning-circle" 20 %}{{ field.errors.0 }}</p>{% endif %}
{% if group %}</fieldset>{% else %}</div>{% endif %}

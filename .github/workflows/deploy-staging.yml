# Staging: every push to main → CI (reusable) → image pushed to GHCR as :<sha> → the `staging`
# tag moves to it. The staging VM's learnplat-watch timer pulls it within a minute, deploys with a
# /healthz gate and rolls back automatically on failure (pull-based: no inbound SSH from CI).
name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/flaviapop/learnplat

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :${{ github.sha }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Move the staging tag
    needs: publish
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: staging → ${{ github.sha }}
        run: docker buildx imagetools create --tag "${IMAGE}:staging" "${IMAGE}@${{ needs.publish.outputs.digest }}"

  verify:
    name: Wait for staging to report healthy
    needs: promote
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Poll /healthz (the VM deploys within ~1 minute)
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "${STAGING_URL}/healthz"; then exit 0; fi
            echo "attempt ${attempt}/30: not healthy yet"; sleep 10
          done
          echo "::error::staging did not report healthy within 5 minutes (check learnplat-watch on the VM)"
          exit 1
